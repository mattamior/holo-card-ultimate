name: Validate Optical Prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optical-browser-artifacts
          path: artifacts/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: holographic-playground
          path: dist/
